<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <title>Blade Runner Demo - Desert Warrior</title>
    <style>
        html, body {
            overflow: hidden;
            width: 100%;
            height: 100%;
            margin: 0;
            padding: 0;
            background: #000;
            font-family: 'Courier New', monospace;
            color: #0ff;
        }
        #renderCanvas {
            width: 100%;
            height: 100%;
            touch-action: none;
        }
        #ui {
            position: absolute;
            top: 20px;
            left: 20px;
            z-index: 10;
            pointer-events: none;
            text-shadow: 0 0 10px #0ff;
        }
        h1 { margin: 0; font-size: 24px; letter-spacing: 4px; }
        p { margin: 5px 0; font-size: 14px; opacity: 0.8; }
    </style>
    <script src="https://cdn.babylonjs.com/babylon.js"></script>
    <script src="https://cdn.babylonjs.com/loaders/babylonjs.loaders.min.js"></script>
</head>
<body>
    <div id="ui">
        <h1>REPLICANT</h1>
        <p>Blade Runner - Desert Warrior Demo</p>
        <p>Drag to orbit • Scroll to zoom</p>
    </div>
    <canvas id="renderCanvas"></canvas>

    <script>
        const canvas = document.getElementById("renderCanvas");
        const engine = new BABYLON.Engine(canvas, true, { preserveDrawingBuffer: true, stencil: true });

        const createScene = async function () {
            const scene = new BABYLON.Scene(engine);
            scene.clearColor = new BABYLON.Color4(0.01, 0.02, 0.05, 1);
            scene.fogMode = BABYLON.Scene.FOGMODE_EXP2;
            scene.fogDensity = 0.012;
            scene.fogColor = new BABYLON.Color3(0.02, 0.03, 0.08);

            // Camera
            const camera = new BABYLON.ArcRotateCamera("camera", Math.PI / 2, Math.PI / 2.8, 8, new BABYLON.Vector3(0, 1.2, 0), scene);
            camera.attachControl(canvas, true);
            camera.lowerRadiusLimit = 2;
            camera.upperRadiusLimit = 40;
            camera.wheelPrecision = 30;

            // Lights
            const hemi = new BABYLON.HemisphericLight("hemi", new BABYLON.Vector3(0, 1, 0), scene);
            hemi.intensity = 0.2;
            hemi.groundColor = new BABYLON.Color3(0.05, 0.05, 0.1);

            const moon = new BABYLON.DirectionalLight("moon", new BABYLON.Vector3(-0.6, -1, -0.2), scene);
            moon.intensity = 0.5;
            moon.diffuse = new BABYLON.Color3(0.4, 0.5, 0.7);

            // Neon colors
            const neonColors = [
                new BABYLON.Color3(1, 0.2, 0.4),
                new BABYLON.Color3(0.2, 0.8, 1),
                new BABYLON.Color3(1, 0.6, 0.1),
                new BABYLON.Color3(0.8, 0.2, 1)
            ];

            // Wet ground
            const ground = BABYLON.MeshBuilder.CreateGround("ground", { width: 100, height: 100, subdivisions: 32 }, scene);
            const groundMat = new BABYLON.PBRMaterial("groundMat", scene);
            groundMat.albedoColor = new BABYLON.Color3(0.04, 0.04, 0.07);
            groundMat.metallic = 0.85;
            groundMat.roughness = 0.12;
            ground.material = groundMat;
            ground.receiveShadows = true;

            scene.environmentTexture = BABYLON.CubeTexture.CreateFromPrefilteredData(
                "https://assets.babylonjs.com/environments/environmentSpecular.env",
                scene
            );
            scene.environmentIntensity = 0.5;

            // Buildings
            function createBuilding(x, z, w, d, h, neonColor) {
                const building = BABYLON.MeshBuilder.CreateBox("building", { width: w, depth: d, height: h }, scene);
                building.position = new BABYLON.Vector3(x, h / 2, z);
                const mat = new BABYLON.PBRMaterial("bmat", scene);
                mat.albedoColor = new BABYLON.Color3(0.07, 0.07, 0.09);
                mat.metallic = 0.4;
                mat.roughness = 0.65;
                building.material = mat;

                const windows = BABYLON.MeshBuilder.CreateBox("windows", { width: w * 0.85, depth: 0.15, height: h * 0.75 }, scene);
                windows.position = building.position.add(new BABYLON.Vector3(0, 0, d / 2 + 0.08));
                const winMat = new BABYLON.PBRMaterial("win", scene);
                winMat.albedoColor = neonColor.scale(0.05);
                winMat.emissiveColor = neonColor;
                winMat.emissiveIntensity = 3;
                windows.material = winMat;

                const light = new BABYLON.PointLight("neon", windows.position.add(new BABYLON.Vector3(0, 0, 1.5)), scene);
                light.diffuse = neonColor;
                light.intensity = 12;
                light.range = 30;
            }

            for (let i = -4; i <= 4; i++) {
                if (Math.abs(i) < 1) continue;
                const side = i > 0 ? 1 : -1;
                createBuilding(side * (10 + Math.abs(i) * 7), -18, 5, 10, 14 + Math.random() * 10, neonColors[Math.abs(i) % 4]);
                createBuilding(side * (10 + Math.abs(i) * 7), 18, 5, 10, 12 + Math.random() * 12, neonColors[(Math.abs(i) + 2) % 4]);
            }

            // Load the GLB character
            try {
                const result = await BABYLON.SceneLoader.ImportMeshAsync("", "./", "desert_warrior.glb", scene);
                const root = result.meshes[0];
                root.position = new BABYLON.Vector3(0, 0, 0);
                root.scaling = new BABYLON.Vector3(1.2, 1.2, 1.2); // Adjust scale if needed
                root.rotation.y = Math.PI; // Face the camera roughly

                // Enable shadows on the character
                result.meshes.forEach(mesh => {
                    if (mesh.getTotalVertices() > 0) {
                        mesh.receiveShadows = true;
                    }
                });

                console.log("Character loaded:", result.meshes.length, "meshes");
            } catch (err) {
                console.error("Failed to load GLB:", err);
                // Fallback simple box
                const box = BABYLON.MeshBuilder.CreateBox("fallback", {size: 1}, scene);
                box.position.y = 1;
            }

            // Rain
            const rain = new BABYLON.ParticleSystem("rain", 4000, scene);
            rain.particleTexture = new BABYLON.Texture("https://assets.babylonjs.com/textures/flare.png", scene);
            rain.emitter = new BABYLON.Vector3(0, 25, 0);
            rain.minEmitBox = new BABYLON.Vector3(-40, 0, -40);
            rain.maxEmitBox = new BABYLON.Vector3(40, 0, 40);
            rain.color1 = new BABYLON.Color4(0.6, 0.7, 1, 0.5);
            rain.color2 = new BABYLON.Color4(0.4, 0.5, 0.8, 0.3);
            rain.minSize = 0.04;
            rain.maxSize = 0.12;
            rain.minLifeTime = 1.2;
            rain.maxLifeTime = 2.2;
            rain.emitRate = 600;
            rain.gravity = new BABYLON.Vector3(0, -18, 0);
            rain.direction1 = new BABYLON.Vector3(-0.3, -1, 0);
            rain.direction2 = new BABYLON.Vector3(0.3, -1, 0);
            rain.start();

            // AAA Post-processing
            const pipeline = new BABYLON.DefaultRenderingPipeline("pipeline", true, scene, [camera]);
            pipeline.samples = 4;
            pipeline.fxaaEnabled = true;
            pipeline.bloomEnabled = true;
            pipeline.bloomThreshold = 0.55;
            pipeline.bloomWeight = 0.7;
            pipeline.bloomKernel = 64;
            pipeline.chromaticAberrationEnabled = true;
            pipeline.chromaticAberration.aberrationAmount = 8;
            pipeline.grainEnabled = true;
            pipeline.grain.intensity = 12;
            pipeline.imageProcessingEnabled = true;
            pipeline.imageProcessing.contrast = 1.15;
            pipeline.imageProcessing.exposure = 0.95;
            pipeline.imageProcessing.toneMappingEnabled = true;
            pipeline.imageProcessing.toneMappingType = BABYLON.ImageProcessingConfiguration.TONEMAPPING_ACES;
            pipeline.imageProcessing.vignetteEnabled = true;
            pipeline.imageProcessing.vignetteWeight = 1.8;

            const gl = new BABYLON.GlowLayer("glow", scene);
            gl.intensity = 0.8;

            return scene;
        };

        createScene().then(scene => {
            engine.runRenderLoop(() => {
                scene.render();
            });
        });

        window.addEventListener("resize", () => {
            engine.resize();
        });
    </script>
</body>
</html>
